name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Android scaffolding
        run: flutter create . --platforms=android --project-name health_monitor --org ir.healthmonitor

      - name: Patch Android manifest (permissions + label)
        run: python3 tool/patch_manifest.py

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-monitor-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "آخرین نسخه اپلیکیشن پایش سلامت" --notes "ساخت خودکار از آخرین commit" || true
          gh release upload latest build/app/outputs/flutter-apk/app-release.apk --clobber
